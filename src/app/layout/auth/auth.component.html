<section class="bg-amber-600 p-1 min-h-dvh lg:h-dvh">
    <div
        class="grid grid-cols-1 lg:grid-cols-2 lg:grid-rows-1 gap-4 bg-[#E5E3E6] rounded-xl
                min-h-[calc(100dvh-0.5rem)] lg:min-h-0 lg:h-full lg:overflow-hidden">

        <div
            class="left hidden lg:flex items-center justify-center p-4 min-h-0 min-w-0">
            <div
                class="image-holder max-w-2xl overflow-hidden rounded-2xl">
                <img class="size-full object-cover"
                    src="/Images/AuthHeroImage2.jpg"
                    alt="heroImage">
            </div>
        </div>

        <div
            class="right flex flex-col min-w-0 px-4 py-6 lg:min-h-0 lg:overflow-y-auto">
            <div class="my-auto w-full flex flex-col items-center gap-4">
                <div class="text-center flex flex-col items-start">
                    <h1
                        class="text-4xl sm:text-5xl lg:text-6xl font-bold text-amber-600">BUBBLE</h1>
                    <p class="mr-auto font-semibold">Stay In Touch</p>
                </div>
                <div class="w-full max-w-md mx-auto flex flex-col gap-4">
                    <!-- Auth Switcher Tabs -->
                    <div class="grid grid-cols-2 gap-2 p-1.5 bg-white/80 backdrop-blur-sm border border-gray-200/90 rounded-2xl shadow-sm">
                        <a routerLink="/auth/login"
                            routerLinkActive="!bg-amber-600 !text-white shadow-md font-bold"
                            class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-sm font-semibold text-gray-600 hover:text-amber-700 hover:bg-white/80 active:scale-[0.98] transition-all duration-200 cursor-pointer">
                            <i class="fa-solid fa-right-to-bracket text-xs" aria-hidden="true"></i>
                            <span>LOGIN</span>
                        </a>
                        <a routerLink="/auth/register"
                            routerLinkActive="!bg-amber-600 !text-white shadow-md font-bold"
                            class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-sm font-semibold text-gray-600 hover:text-amber-700 hover:bg-white/80 active:scale-[0.98] transition-all duration-200 cursor-pointer">
                            <i class="fa-solid fa-user-plus text-xs" aria-hidden="true"></i>
                            <span>Register</span>
                        </a>
                    </div>

                    <!-- Router Outlet for Child Forms -->
                    <div class="router w-full flex flex-col">
                        <router-outlet></router-outlet>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

@if(SuccessFlag){
<div
    class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-max max-w-[90vw] p-4 text-sm text-fg-success-strong rounded-base bg-success-soft shadow-lg"
    role="alert">
    <span class="font-medium">Success alert!</span> Account Created
    Successfully.
</div>
}
@if(FailedFlag){
<div
    class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-max max-w-[90vw] p-4 text-sm text-fg-danger-strong rounded-base bg-danger-soft shadow-lg"
    role="alert">
    <span class="font-medium">Failed alert!</span> Registration Failed!!
</div>
}
