<aside class="h-full overflow-y-auto overscroll-contain p-3 flex flex-col gap-3">

    <!-- Navigation -->
    <nav class="flex flex-col gap-2">
        <button type="button" class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl font-bold text-base text-black bg-[#f7f7f7] cursor-pointer hover:bg-amber-50 focus-visible:outline-2 focus-visible:outline-amber-600 transition-colors" 
        routerLink="/main/feed">
            <i class="fa-solid fa-newspaper w-5 text-center text-amber-600" aria-hidden="true"></i>
            <span>Feed</span>
        </button>
        <button type="button" class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl font-bold text-base text-black bg-[#f7f7f7] cursor-pointer hover:bg-amber-50 focus-visible:outline-2 focus-visible:outline-amber-600 transition-colors">
            <i class="fa-solid fa-wand-magic-sparkles w-5 text-center text-amber-600" aria-hidden="true"></i>
            <span>My Posts</span>
        </button>
        <button type="button" class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl font-bold text-base text-black bg-[#f7f7f7] cursor-pointer hover:bg-amber-50 focus-visible:outline-2 focus-visible:outline-amber-600 transition-colors">
            <i class="fa-solid fa-people-group w-5 text-center text-amber-600" aria-hidden="true"></i>
            <span>Community</span>
        </button>
        <button type="button" class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl font-bold text-base text-black bg-[#f7f7f7] cursor-pointer hover:bg-amber-50 focus-visible:outline-2 focus-visible:outline-amber-600 transition-colors">
            <i class="fa-solid fa-bookmark w-5 text-center text-amber-600" aria-hidden="true"></i>
            <span>Saved</span>
        </button>
    </nav>

    <!-- Suggested friends -->
    <div class="suggested-friends rounded-xl bg-[#f7f7f7] p-3 flex flex-col gap-3">
        <div class="head flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
                <i class="fa-solid fa-users w-5 text-center text-amber-600" aria-hidden="true"></i>
                <p class="font-bold text-base mb-0 truncate">Suggested Friends</p>
            </div>
            <span class="flex items-center justify-center shrink-0 size-6 rounded-full bg-amber-600 text-white text-xs font-bold">{{Friends?.length}}</span>
        </div>


        <div class="friends-list flex flex-col gap-2">
            @for(friend of Friends ;track friend._id){
                <div class="friend bg-white rounded-xl p-2.5 shadow-sm hover:shadow-md transition-shadow flex flex-col gap-2">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <img class="size-11 shrink-0 rounded-full object-cover" [src]="friend.photo" alt="Khaled Eid profile picture">
                            <div class="min-w-0">
                                <h2 class="font-bold text-sm leading-tight mb-0 truncate">{{friend.name}}</h2>
                                <p class="mb-0 text-xs text-[#767676] truncate">{{friend.username}}</p>
                            </div>
                        </div>
                        <button type="button" (click)="FollowOrUnfollow(friend._id)" class="flex items-center justify-center shrink-0 gap-1.5 rounded-full bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 cursor-pointer focus-visible:outline-2 focus-visible:outline-amber-600 active:scale-95 transition">
                            <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                            <span>Follow</span>
                        </button>
                    </div>
                    <div class="flex flex-wrap items-center justify-center gap-2">
                        <span class="flex items-center gap-1.5 rounded-full text-xs font-bold px-2.5 py-1 bg-[#dfdfdf]"><strong>{{friend.followersCount}}</strong> followers</span>
                        <span class="flex items-center gap-1.5 rounded-full text-xs font-bold px-2.5 py-1 bg-amber-600 text-white"><strong>{{friend.mutualFollowersCount}}</strong> mutual</span>
                    </div>
                </div>
            }
        </div>

        <button type="button" class="w-full py-2.5 border-t border-[#dfdfdf] rounded-b-xl font-bold text-sm text-center cursor-pointer hover:bg-white hover:text-amber-700 transition-colors">
            View More
        </button>
    </div>
</aside>
